# Magento 2.4 CI — validação estática. Sem deploy automático.
#
# Práticas Magento 2 / AWA:
#   - Validar só código custom (GrupoAwamotos + tema filho).
#   - Não SSH, não cache:flush, não setup:upgrade neste workflow.
#   - Deploy de produção não roda em push/tag; exige workflow_dispatch + confirmação.
#   - Staging não pode apontar para o DocumentRoot de produção.
name: magento-ci

on:
  pull_request:
  push:
    branches:
      - main
      - rescue/production-20260712
  workflow_dispatch:
    inputs:
      action:
        description: "validate (padrão) ou imprimir runbook de deploy"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - print-deploy-runbook

permissions:
  contents: read
  actions: write

concurrency:
  group: magento-ci-${{ github.ref }}-${{ github.event.inputs.action || github.event_name }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"

jobs:
  validate:
    name: Magento static validation
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'validate'
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: bcmath, ctype, curl, dom, gd, intl, mbstring, opcache, pdo_mysql, soap, sockets, xsl, zip
          tools: composer:v2

      - name: Recusar env.php e auth.json no Git
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch app/etc/env.php >/dev/null 2>&1; then
            echo "app/etc/env.php não deve estar no repositório (Magento 2)."
            exit 1
          fi
          if git ls-files --error-unmatch auth.json >/dev/null 2>&1; then
            echo "auth.json não deve estar no repositório (Magento 2)."
            exit 1
          fi
          echo "OK: env.php e auth.json fora do Git."

      - name: Composer validate
        run: composer validate --no-check-all --no-interaction

      - name: PHP custom (GrupoAwamotos / Awa / scripts)
        run: bash ./scripts/ci/lint-custom-php.sh

      - name: PHTML custom (tema filho + GrupoAwamotos)
        run: bash ./scripts/ci/lint-magento-phtml.sh

      - name: XML well-formed (tema filho + GrupoAwamotos)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          bash ./scripts/ci/lint-magento-xml.sh

      - name: PHPCS Magento2 (custom, não bloqueante)
        continue-on-error: true
        run: |
          set -euo pipefail
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction magento/magento-coding-standard
          PHPCS="$HOME/.config/composer/vendor/bin/phpcs"
          if [ ! -x "$PHPCS" ]; then PHPCS="$HOME/.composer/vendor/bin/phpcs"; fi
          mkdir -p artifacts/phpcs
          "$PHPCS" --standard=Magento2 \
            --extensions=php,phtml \
            --ignore=*/vendor/*,*/Test/*,*/tests/* \
            --report=full \
            --report-file=artifacts/phpcs/magento2.txt \
            app/code/GrupoAwamotos \
            app/design/frontend/AWA_Custom \
            || true
          echo "PHPCS Magento2 gerou artifacts/phpcs/magento2.txt (não bloqueia até haver baseline)."

      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magento-phpcs-${{ github.run_id }}
          path: artifacts/phpcs/**
          if-no-files-found: ignore
          retention-days: 14

  deploy-runbook:
    name: Magento deploy runbook (dry-run)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'print-deploy-runbook'
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Imprimir sequência Magento 2 (sem executar)
        run: bash ./scripts/ci/magento-deploy-sequence.sh

      - name: Recusar DocumentRoot de produção neste job
        run: |
          set -euo pipefail
          echo "Este job não faz SSH. Deploy real exige host de staging distinto e GO operacional."
          echo "DocumentRoot de produção (srv1113343 / awamotos.com) está bloqueado neste workflow."
