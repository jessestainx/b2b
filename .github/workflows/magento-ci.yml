# AWA Motos — CI/CD Pipeline
#
# STATUS: QUARENTENA PARCIAL — DEPLOY NO-GO
# Ticket: CI-CONTAINMENT-FASE1-2026-07-22
#
# Deploy staging/production: BLOQUEADOS (if: false). Secrets removidos dos jobs.
# NÃO reparar o grafo needs:validate nesta fase — jobs de deploy devem permanecer
# inalcançáveis mesmo se o grafo for “consertado” no futuro sem aprovação.
#
# Reativação de deploy (futuro, fora da Fase 1):
#   - staging isolado documentado
#   - GitHub Environment com reviewers obrigatórios
#   - zero hardcode de produção
#   - ticket + aprovação explícita
# Job skipped NÃO conta como prova de segurança ou teste aprovado.

name: AWA Motos CI/CD

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "20"
  MAGENTO_ROOT: ${{ github.workspace }}

jobs:
  # ====================================
  # 1. VALIDAÇÃO ESTÁTICA LEVE (PR only)
  # Sem rede externa, sem Playwright, sem deploy.
  # ====================================
  validate:
    name: Validate code (static)
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl,mbstring,curl,gd,zip,xml,bcmath,opcache

      - name: Validate PHTML syntax (custom theme)
        run: |
          set -euo pipefail
          # Limitado a arquivos versionados recentes; sem composer install / sem Magento runtime
          find app/design -name "*.phtml" 2>/dev/null | head -500 | while read -r f; do
            php -l "$f" >/dev/null
          done
          echo "PHTML syntax OK (sample/limit)"

      - name: Validate XML layout (custom theme)
        run: |
          set -euo pipefail
          if command -v xmllint >/dev/null 2>&1; then
            find app/design -name "*.xml" 2>/dev/null | head -500 | while read -r f; do
              xmllint --noout "$f" || exit 1
            done
            echo "XML lint OK (sample/limit)"
          else
            echo "xmllint ausente — skip"
          fi

  # ====================================
  # 2. DEPLOY STAGING — QUARENTENA
  # ====================================
  deploy-staging:
    name: "QUARANTINE: Deploy to staging"
    runs-on: ubuntu-22.04
    # Contenção explícita — NÃO remover sem ticket + environment staging aprovado
    if: ${{ false }}
    # environment removido nesta fase (evita binding a secrets de deploy)
    steps:
      - name: Quarantined — deploy staging NO-GO
        run: |
          echo "STATUS: QUARENTENA — NÃO EXECUTAR"
          echo "Ticket: CI-CONTAINMENT-FASE1-2026-07-22"
          echo "Job skipped NÃO é comprovação de segurança."
          exit 1

  # ====================================
  # 3. DEPLOY PRODUÇÃO — QUARENTENA
  # ====================================
  deploy-production:
    name: "QUARANTINE: Deploy to production"
    runs-on: ubuntu-22.04
    # Contenção explícita — produção NO-GO
    if: ${{ false }}
    steps:
      - name: Quarantined — deploy production NO-GO
        run: |
          echo "STATUS: QUARENTENA — NÃO EXECUTAR"
          echo "Ticket: CI-CONTAINMENT-FASE1-2026-07-22"
          echo "Produção permanece NO-GO. Sem SSH. Sem secrets."
          exit 1

  # ====================================
  # 4. LIGHTHOUSE (antigo) — QUARENTENA
  # Apontava para .lighthouserc.js com URLs de produção.
  # ====================================
  lighthouse:
    name: "QUARANTINE: Lighthouse audit"
    runs-on: ubuntu-22.04
    if: ${{ false }}
    steps:
      - name: Quarantined — lighthouse prod NO-GO
        run: |
          echo "STATUS: QUARENTENA — NÃO EXECUTAR"
          exit 1
