name: menu-regression

on:
  workflow_dispatch:

jobs:
  menu-regression:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.49.1 --no-save
          npx playwright install chromium --with-deps

      - name: Run menu regression spec
        env:
          AWA_BASE_URL: https://awamotos.com
        run: node tests/e2e/specs/menu-regression.mjs
