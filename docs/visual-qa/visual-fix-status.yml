      locais triggerLazyImages() (scroll-through vertical com behavior:'instant' e
      confirmacao de retorno a scrollY=0) e findRealBrokenImages() (mesma logica do helper
      original, mas exige bounding box > 0x0 alem de complete && naturalWidth===0). O
      helper compartilhado tests/e2e/helpers/deep-audit.helpers.ts (findBrokenImages) NAO
      foi alterado (usado por 6+ outros specs fora do escopo desta branch). Nenhum arquivo
