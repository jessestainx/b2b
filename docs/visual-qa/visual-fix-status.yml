  - id: PLP-P0-001
    title: "Header de categoria com banner/placeholder vazio"
    phase: P0
    page_type: plp
    component: "category-header"
    route: "/bagageiros.html"
    status: REPRODUCED
    priority: critical
    source_files:
      - app/design/frontend/AWA_Custom/ayo_home5_child/web/css/source/_awa-product-cards-modern.less#L84-L91
      - app/design/frontend/AWA_Custom/ayo_home5_child/web/css/source/_visual-bug-fixes.less#L102-L105
      - app/design/frontend/AWA_Custom/ayo_home5_child/Magento_Catalog/templates/category/image.phtml
    tests: { playwright: [tests/e2e/specs/plp-visual-baseline.spec.ts] }
    evidence_dir: docs/visual-qa/evidence/PLP-P0-001
    acceptance:
      - "Sem banner fantasma ou placeholder vazio"
      - "Titulo e contagem legiveis"
      - "Espacamento entre header e toolbar <= 32px"
      - "Altura do header de categoria entre 96-160px quando sem banner real"
      - "Desktop e mobile validados"
    proof: { before_screenshot: "image(32).png", after_screenshot: null, ci_run: null, playwright_report: null, commit: null, pr: null }
    root_cause_confirmed: >
      Medido via plp-visual-baseline.spec.ts contra producao (2026-07-09): getComputedStyle real de
      .awa-category-hero__bg-image e opacity:0.32, position:relative, tamanho 1214x132px dentro de um hero
      de 1216x160px — ou seja, a imagem PREENCHE corretamente a area (a hipotese inicial de que
      position:relative!important em _visual-bug-fixes.less#L102-105 encolheria a imagem para o tamanho
      intrinseco do HTML foi testada e descartada pelos dados reais). A causa da aparencia
      "fantasma/quase invisivel" e simplesmente opacity:0.32 no elemento. O asset em si existe e e valido
      (pub/media/catalog/category/cat-bagageiros.png, 1080x1080px, 502KB) — nao e imagem ausente.
      Pendente: identificar a regra LESS exata que aplica opacity:0.32 — busca estatica por "opacity: 0.3"
      em ~90 arquivos LESS do tema nao encontrou o valor exato ligado a este seletor (cascata complexa,
      varios arquivos tocam .awa-category-hero__bg-image: _awa-product-cards-modern.less,
      _visual-bug-fixes.less, _awa-plp-grid-mobile-2026-06.less, _awa-category-layout-fix.less,
      _awa-impeccable-layout-2026-06-16.less, _awa-plp-consistency-pass2-2026-06.less,
      _awa-plp-refine-terminal-2026-06.less, _awa-async-bundle-distill-2026-06.less). Antes de corrigir,
      usar DevTools > Computed > rastrear a regra vencedora de "opacity" neste elemento (nao adivinhar).
      Decisao de design tambem pendente: opacity baixa pode ter sido intencional (efeito de leitura sob o
      titulo) — validar com o time se o requisito e "sem opacidade" ou "banner com imagem nitida + overlay
      de leitura", antes de simplesmente remover a regra.

