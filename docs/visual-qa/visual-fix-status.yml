    source_files: [tests/e2e/specs/product-design-qa.spec.ts]
    tests: { playwright: [tests/e2e/specs/product-design-qa.spec.ts, tests/e2e/specs/header-core-interactions-p0.spec.ts] }
    evidence_dir: tests/e2e/test-results/product-design-qa
    acceptance:
      - "verticalMenu.visible = true apos clique no trigger"
      - "Screenshot menu-vertical-aberto gerado com sucesso"
      - "header-core-interactions-p0.spec.ts (diagnostico home) permanece passando (sem regressao)"
    proof: { before_screenshot: null, after_screenshot: "desktop-1440__menu-vertical-aberto.png", ci_run: null, playwright_report: null, commit: null, pr: null }
    root_cause_confirmed: >
      Investigado com 3 metodos independentes (script Playwright puro, spec no test runner real,
      comparacao lado a lado no mesmo estado de pagina). O painel do menu vertical
      (.togge-menu.list-category-dropdown) abre corretamente em producao: aria-expanded=true,
      classes vmm-open/menu-open, aria-hidden=false, display:flex, bbox 304x560, sem erros de
      console/rede. O helper isVisible()/getBBox() (tests/e2e/helpers/header.helpers.ts) usa
      locator.waitFor({state:'visible'}), que estourou timeout mesmo com o elemento visivel —
      provavelmente por causa do ajuste continuo de altura via requestAnimationFrame que
      awa-menu-controller.js (DeptMenu.prototype.schedulePanelHeight) aplica por ate 5 quadros
      apos abrir. locator.isVisible() (sem polling de estabilidade) retornou o estado correto.
      NENHUM defeito foi encontrado no tema/JS/CSS/template do menu vertical.
    fix_applied: >
      Escopo limitado a tests/e2e/specs/product-design-qa.spec.ts: substituida a chamada
      isVisible(page, awaSelectors.verticalMenu.list) / getBBox(...) por
      page.locator(awaSelectors.verticalMenu.list).first().isVisible() / .boundingBox()
      diretos. O helper compartilhado header.helpers.ts NAO foi alterado (fora de escopo desta
      branch fix/pd1-vertical-menu-p0). Nenhum arquivo de tema/template/LESS/JS do Magento foi
      tocado, pois nao havia defeito de produto a corrigir.
