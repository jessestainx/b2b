  - id: PLP-P0-005
    title: "Widget de pedidos recentes indevido na PLP"
    phase: P0
    page_type: plp
    component: "sidebar"
    route: "/bagageiros.html"
    status: TESTED_LOCAL
    priority: critical
    source_files:
      - app/design/frontend/AWA_Custom/ayo_home5_child/Magento_Catalog/layout/catalog_category_view.xml#L15-L19
    tests: { playwright: [tests/e2e/specs/plp-visual-baseline.spec.ts] }
    evidence_dir: docs/visual-qa/evidence/PLP-P0-005
    acceptance:
      - "Widget nao aparece em PLP quando vazio"
      - "Sem CTA duplicado"
      - "Sidebar mostra apenas filtros uteis"
    proof: { before_screenshot: "image(32).png", after_screenshot: "after-desktop-1440-logged-in.png", ci_run: null, playwright_report: null, commit: null, pr: null }
    fix_applied: >
      Adicionado <referenceBlock name="sale.reorder.sidebar" remove="true"/> em
      Magento_Catalog/layout/catalog_category_view.xml (mesmo padrao ja usado em
      Magento_Cms/layout/cms_index_index.xml para a Home). Validado em 2026-07-09 com login
      real (customer_id 9068, conta de teste com 1 pedido, senha temporaria redefinida via
      encryptor + revertida apos o teste) em /bagageiros.html: sidebar-additional renderiza vazia
      (catalog-sidebar-adv, display:none), reorderBlockCount=0. cache:flush executado apos a
      mudanca. Sem novas entradas em exception.log/system.log. Static-content-deploy nao aplicavel
      (layout XML, nao CSS/JS estatico).
    root_cause_hypothesis: >
      sale.reorder.sidebar (bloco nativo Magento) foi explicitamente removido em
      Magento_Cms/layout/cms_index_index.xml (linha 60, <referenceBlock name="sale.reorder.sidebar"
      remove="true"/>) para a Home, mas NAO existe remocao equivalente em
      Magento_Catalog/layout/catalog_category_view.xml nem em Magento_Theme/layout/catalog_category_view.xml.
      E a causa mais provavel do widget "Pedidos feitos recentemente" aparecer na sidebar.additional
      da categoria. Validado parcialmente via plp-visual-baseline.spec.ts em 2026-07-09: como guest
      (nao autenticado), .block-reorder nao renderiza (count:0) — comportamento nativo esperado do Magento
      (o bloco so mostra pedidos para cliente logado com historico), o que NAO contradiz a hipotese, apenas
      significa que o baseline guest nao reproduz visualmente o bug. Falta validar com sessao B2B logada
      com pedidos recentes (mesmo contexto da screenshot original) antes de aplicar a correcao.

