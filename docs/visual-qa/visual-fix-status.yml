agent_instructions: docs/visual-qa/visual-fix-agent-instructions.md
last_updated: "2026-07-09"
migrated_from: docs/visual-qa/home-visual-fix-status.yml
migration_note: >
  v1 (home-visual-fix-status.yml) era exclusivo da Home. v2 generaliza para qualquer
  pagina/componente global. HOME-P0-003 (header/minicart/conta) foi renomeado para
  HEADER-P0-001; HOME-P0-004 (menu Departamentos) foi renomeado para HEADER-P0-002;
  HOME-P0-005 (footer contraste) foi absorvido por FOOTER-P0-001 (mesmo componente
  global, causa raiz unica). HOME-P0-006 (carrosseis) foi renumerado para HOME-P0-003.
  Nenhum conteudo foi duplicado — apenas consolidado sob o componente global correto.

rules:
  source_of_truth:
    - app/code
    - app/design
    - docs
    - tests
  forbidden_as_source:
    - pub/static
    - var/view_preprocessed
    - vendor
    - generated
    - node_modules
  design_tokens_file: app/design/frontend/AWA_Custom/ayo_home5_child/web/css/source/_tokens.less

statuses:
  - TODO
  - REPRODUCED
  - IN_PROGRESS
  - FIXED_SOURCE
  - DEPLOYED_STAGING
  - TESTED_LOCAL
  - TESTED_CI
  - VERIFIED_PROD
  - BLOCKED
  - WONTFIX
  - CLOSED

page_types:
  - global-header
  - global-footer
  - home
  - plp

