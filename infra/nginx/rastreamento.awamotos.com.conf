# Traccar GPS Tracking - rastreamento.awamotos.com
# SSL via Let's Encrypt (renovacao automatica)

server {
  listen 80;
  server_name rastreamento.awamotos.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name rastreamento.awamotos.com;

  ssl_certificate /etc/letsencrypt/live/rastreamento.awamotos.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rastreamento.awamotos.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 50M;

  # Traccar Client (OsmAnd HTTP): GET /?id=DEVICE&lat=...&lon=...
  # Apenas a raiz com ?id=... e um pacote GPS; APIs como /api/positions?id=...
  # precisam continuar indo para a interface web/API na porta 8082.
  location = / {
    set $traccar_port 8082;
    if ($arg_id != "") {
      set $traccar_port 15055;
    }

    proxy_pass http://127.0.0.1:$traccar_port$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_buffering off;
    proxy_cache off;
  }

  location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_buffering off;
    proxy_cache off;
  }
}

# Traccar Client com URL https://rastreamento.awamotos.com:5055
# TLS termina aqui; backend OsmAnd HTTP plain em 127.0.0.1:15055
server {
  listen 5055 ssl;
  http2 on;
  server_name rastreamento.awamotos.com;

  ssl_certificate /etc/letsencrypt/live/rastreamento.awamotos.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rastreamento.awamotos.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:15055$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_buffering off;
  }
}
