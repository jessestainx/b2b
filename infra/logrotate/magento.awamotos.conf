# Rotação de logs Magento AWA Motos — instalar com:
#   sudo cp infra/logrotate/magento.awamotos.conf /etc/logrotate.d/magento-awamotos
/var/www/*/htdocs/*/var/log/*.log
/home/*/htdocs/*/var/log/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 100M
    su www-data www-data
}
