<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b73337">
<title>Offline - AWA Motos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 48px 32px;
    max-width: 480px;
    text-align: center;
}
.logo { font-size: 32px; font-weight: 800; color: #b73337; margin-bottom: 16px; }
h1 { font-size: 24px; margin-bottom: 16px; font-weight: 600; }
p { color: rgba(255,255,255,0.7); margin-bottom: 24px; line-height: 1.5; }
button {
    background: #b73337;
    color: #fff;
    border: 0;
    padding: 12px 32px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 200ms;
}
button:hover { background: #8e2629; }
.icon {
    width: 64px; height: 64px; margin: 0 auto 24px;
    background: #b73337;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
}
.icon svg { width: 32px; height: 32px; stroke: #fff; }
</style>
</head>
<body>
<div class="card">
    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
        </svg>
    </div>
    <div class="logo">AWA MOTOS</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar à internet. Verifique sua conexão e tente novamente.</p>
    <button onclick="window.location.reload()">🔄 Tentar novamente</button>
</div>
</body>
</html>
